spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=gm_company&stringtype=unspecified
    username: postgres
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-init-sql: SELECT 1
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # password: 生产环境必填
      timeout: 5000ms

jwt:
  # 演示用密钥（HS256 需要 >= 256bit），生产环境改为环境变量注入
  secret: "gm-ace-backend-secret-key-change-me-please-2026-09-01-abcdefghijklmn"
  # 令牌有效期（秒）
  expire-seconds: 7200
  # 刷新令牌有效期（秒）
  refresh-seconds: 604800
